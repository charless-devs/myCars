<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#071a35">
  <title>Page Not Found – FORD</title>
  <link rel="icon" type="image/svg+xml" href="{{ url_for('static', filename='favicon.svg') }}">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&family=Syne:wght@600;700;800&display=swap" rel="stylesheet">
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100svh;
      display: grid;
      place-items: center;
      text-align: center;
      background:
        radial-gradient(900px 480px at 80% -10%, rgba(17, 86, 168, .4), transparent 70%),
        linear-gradient(180deg, #071a35, #050f1f);
      color: #eef2f8;
      font-family: "Manrope", "Segoe UI", Helvetica, Arial, sans-serif;
      padding: 24px;
    }
    .mark { font-family: "Syne", sans-serif; font-weight: 800; font-size: 1.2rem; letter-spacing: .34em; margin-right: -.34em; color: #fff; }
    .mark small { display: block; margin-top: 6px; font-family: "Manrope", sans-serif; font-size: .5rem; font-weight: 600; letter-spacing: .42em; margin-right: -.42em; color: #d9bd85; }
    .code { margin: 40px 0 0; font-family: "Syne", sans-serif; font-size: clamp(5rem, 22vw, 12rem); font-weight: 800; line-height: .8; letter-spacing: .04em; background: linear-gradient(115deg, #fff 40%, #ecd7ab 75%, #a8823f 100%); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; color: transparent; }
    h1 { margin: 26px 0 10px; font-family: "Syne", sans-serif; font-size: clamp(1.4rem, 3vw, 2rem); font-weight: 700; letter-spacing: -.02em; }
    p { margin: 0 auto; max-width: 46ch; color: rgba(238, 242, 248, .65); font-size: .95rem; }
    .actions { display: flex; flex-wrap: wrap; justify-content: center; gap: 14px; margin-top: 36px; }
    a.btn {
      min-width: 180px;
      height: 54px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 0 24px;
      border: 1px solid transparent;
      text-transform: uppercase;
      letter-spacing: .14em;
      font-size: .7rem;
      font-weight: 700;
      transition: transform .25s cubic-bezier(.22, 1, .36, 1), box-shadow .25s;
    }
    a.btn-primary { background: linear-gradient(120deg, #d9bd85, #a8823f); color: #071a35; box-shadow: 0 14px 34px rgba(168, 130, 63, .28); }
    a.btn-primary:hover { transform: translateY(-2px); box-shadow: 0 18px 42px rgba(168, 130, 63, .4); }
    a.btn-ghost { border-color: rgba(255, 255, 255, .5); color: #fff; }
    a.btn-ghost:hover { background: #fff; color: #071a35; }
    a:focus-visible { outline: 2px solid #d9bd85; outline-offset: 3px; }
  </style>
</head>
<body>
  <main>
    <div class="mark">FORD<small>Performance</small></div>
    <p class="code">404</p>
    <h1>This road doesn't exist</h1>
    <p>The page you're looking for was moved, renamed, or never built. Let's get you back on the road.</p>
    <div class="actions">
      <a class="btn btn-primary" href="{{ url_for('home_page') }}">Back to Home</a>
      <a class="btn btn-ghost" href="{{ url_for('dashboard_page') }}">View Collection</a>
    </div>
  </main>
</body>
</html>
