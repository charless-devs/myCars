<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>List view test</title>
  <link rel="stylesheet" href="css/dashboard.css">
</head>
<body>
  <main class="main-content" style="margin-left:0">
    <div class="car-grid list-view" id="car-grid">
      <button class="car-card" type="button" data-category="Mustang" data-car-id="ford-mustang-1965">
        <span class="card-media"><img src="https://commons.wikimedia.org/wiki/Special:FilePath/1965_Ford_Mustang_2D_Hardtop_Front.jpg?width=900" alt="1965 Ford Mustang 289"><span class="card-index">01</span></span>
        <span class="card-copy"><strong>Ford Mustang 289 (1965)</strong><span>View details ↗</span></span>
      </button>
      <button class="car-card" type="button" data-category="Classics" data-car-id="ford-torino-1969">
        <span class="card-media"><img src="https://commons.wikimedia.org/wiki/Special:FilePath/1970_ford_torino_cobra_sportsroof_chiolero.jpg?width=900" alt="Ford Torino Cobra Jet"><span class="card-index">02</span></span>
        <span class="card-copy"><strong>Ford Torino Cobra Jet (1969)</strong><span>View details ↗</span></span>
      </button>
      <button class="car-card is-hidden" type="button" data-category="Rally" data-car-id="ford-rs200-1985">
        <span class="card-media"><img src="https://commons.wikimedia.org/wiki/Special:FilePath/White_Ford_RS200.jpg?width=900" alt="Ford RS200"><span class="card-index">04</span></span>
        <span class="card-copy"><strong>Ford RS200 (1985) — HIDDEN TEST</strong><span>View details ↗</span></span>
      </button>
      <button class="car-card" type="button" data-category="Performance" data-car-id="ford-gt-2017">
        <span class="card-media"><img src="https://commons.wikimedia.org/wiki/Special:FilePath/Ford_GT_2018_and_Ford_GT_1968_at_Legendy_2019_in_Prague_%28cropped%29.jpg?width=900" alt="Ford GT"><span class="card-index">07</span></span>
        <span class="card-copy"><strong>Ford GT (2017)</strong><span>View details ↗</span></span>
      </button>
    </div>
  </main>
</body>
</html>
